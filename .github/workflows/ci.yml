name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# One run per ref: a force-push or a quick follow-up commit cancels the older run
# instead of paying for two full suites.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The suite reads its connection from here (tests/Support/TestDatabase.php),
  # the same variables the application uses.
  DB_HOST: 127.0.0.1
  DB_PORT: '3306'
  DB_USERNAME: root
  DB_PASSWORD: ''
  DB_TEST_DATABASE: codevault_test
  APP_ENV: testing
  APP_URL: http://localhost:8000

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: codevault_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, openssl, pdo_mysql, pdo_sqlite, sqlite3, zip, intl, bcmath, gd
          ini-values: memory_limit=512M, error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --prefer-dist --no-progress

      - name: Ensure the test schema exists
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root \
            --execute="CREATE DATABASE IF NOT EXISTS codevault_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Check the generated schema snapshot is current
        run: php bin/build-schema.php --check

      - name: Run the test suite
        id: phpunit
        continue-on-error: true
        run: |
          set +e
          vendor/bin/phpunit --no-coverage 2>&1 | tee /tmp/phpunit.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # A failed suite whose output nobody can retrieve is only marginally better
      # than no suite at all. Every failure is echoed as a check annotation, so the
      # reason is visible on the PR itself.
      - name: Annotate test failures
        if: steps.phpunit.outputs.exit != '0'
        run: |
          # One annotation per failure block (PHPUnit separates them with blank
          # lines), newlines encoded so the whole block shows on the PR.
          awk 'BEGIN { RS = "" } /^[0-9]+\) / { gsub(/\r/, ""); gsub(/%/, "%25"); gsub(/\n/, "%0A"); print substr($0, 1, 1200) }' \
            /tmp/phpunit.txt | head -40 | while IFS= read -r block; do
              echo "::error title=PHPUnit failure::${block}"
            done
          tail -n 5 /tmp/phpunit.txt

      - name: Fail the job if the suite failed
        if: steps.phpunit.outputs.exit != '0'
        run: exit 1

      - name: Dump the PHP error log if a step failed
        if: failure()
        run: cat storage/cache/php-error.log 2>/dev/null || true

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: codevault_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, openssl, pdo_mysql, pdo_sqlite, sqlite3, zip, intl, bcmath, gd
          ini-values: memory_limit=512M
          tools: composer:v2
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --prefer-dist --no-progress

      - name: Ensure the test schema exists
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root \
            --execute="CREATE DATABASE IF NOT EXISTS codevault_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Run the suite with coverage
        id: phpunit
        continue-on-error: true
        run: |
          set +e
          vendor/bin/phpunit --coverage-clover=build/coverage/clover.xml \
            --coverage-text --only-summary-for-coverage-text 2>&1 | tee /tmp/phpunit.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Annotate test failures
        if: steps.phpunit.outputs.exit != '0'
        run: |
          awk 'BEGIN { RS = "" } /^[0-9]+\) / { gsub(/\r/, ""); gsub(/%/, "%25"); gsub(/\n/, "%0A"); print substr($0, 1, 1200) }' \
            /tmp/phpunit.txt | head -40 | while IFS= read -r block; do
              echo "::error title=PHPUnit failure::${block}"
            done
          tail -n 5 /tmp/phpunit.txt

      - name: Fail the job if the suite failed
        if: steps.phpunit.outputs.exit != '0'
        run: exit 1

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage/
          if-no-files-found: ignore
          retention-days: 14

  static-analysis:
    name: Static analysis and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, openssl, pdo_mysql, zip, intl, bcmath, gd
          ini-values: memory_limit=1G
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --prefer-dist --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Coding style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Syntax check every PHP file
        run: |
          find core bin routes public tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          php -l index.php

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Audit dependencies for known advisories
        # --locked audits composer.lock itself, so the job needs no vendor/
        # install to answer "is anything we ship vulnerable?".
        run: |
          composer --version
          set +e
          output=$(composer audit --locked --no-interaction 2>&1)
          status=$?
          echo "$output"
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface the reason as an annotation: job logs are not always
            # reachable from every environment that consumes this workflow.
            escaped=$(printf '%s' "$output" | tail -c 1400 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=composer audit failed::${escaped}"
          fi
          exit "$status"

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes in this pull request
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
